<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雾镇旅馆 · 审讯</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="case-header">
      <div class="header-inner">
        <div class="case-heading">
          <p class="case-kicker">CASE FILE · MISTVALE INN</p>
          <h1 id="game-title">雾镇旅馆</h1>
          <p id="era" class="case-era">1937 年冬 · 暴雪封山</p>
        </div>
        <div class="header-actions">
          <button id="restart-button" class="ghost-button" type="button">重开</button>
          <button id="accuse-button" class="accuse-button" type="button" disabled>指认</button>
        </div>
      </div>
    </header>

    <main class="layout">
      <aside class="panel suspects-panel" aria-label="嫌疑人">
        <div class="panel-title">
          <span>嫌疑人</span>
          <span id="suspect-count" class="panel-count">00</span>
        </div>
        <div id="suspect-list" class="suspect-list"></div>
      </aside>

      <section class="panel dialogue-panel" aria-label="审讯记录">
        <div class="panel-title">
          <span>审讯记录</span>
          <span id="current-suspect-label" class="panel-count">未选择</span>
        </div>
        <div id="dialogue-hint" class="dialogue-hint">先选一个嫌疑人，开始问话。</div>
        <div id="dialogue" class="dialogue" aria-live="polite"></div>
        <form id="ask-form" class="ask-form" autocomplete="off">
          <input id="question-input" type="text" maxlength="200"
                 placeholder="先选一个嫌疑人，再开口……" aria-label="向嫌疑人提问">
          <button id="send-button" class="send-button" type="submit" disabled>问</button>
        </form>
      </section>

      <aside class="panel clues-panel" aria-label="物证">
        <div class="panel-title">
          <span>物证</span>
          <span id="clue-count" class="panel-count">00</span>
        </div>
        <div id="clue-board" class="clue-board" aria-live="polite"></div>
        <div id="present-panel" class="present-panel hidden">
          <button id="present-button" class="present-button" type="button">出示给当前嫌疑人</button>
          <p id="present-target" class="present-target">先选一个嫌疑人</p>
        </div>
      </aside>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

  <section id="verdict" class="verdict hidden" aria-hidden="true" role="dialog"
           aria-modal="true" aria-labelledby="verdict-title">
    <div class="verdict-frame">
      <header class="verdict-header">
        <p class="case-kicker">CASE CLOSED?</p>
        <h2 id="verdict-title" class="verdict-result">真相</h2>
        <p id="verdict-subtitle" class="verdict-subtitle"></p>
      </header>
      <div class="verdict-grid">
        <section class="truth-panel">
          <h3>真相时间线</h3>
          <ol id="truth-timeline" class="truth-list"></ol>
        </section>
        <section class="missed-panel">
          <h3>你漏掉的破案链</h3>
          <p id="missed-summary" class="missed-summary"></p>
          <div id="missed-ids" class="missed-ids"></div>
          <p class="missed-note">只给编号，内容留给你自己回去想。</p>
        </section>
      </div>
      <footer class="verdict-actions">
        <button id="restart-verdict" class="ghost-button" type="button">重新开局</button>
      </footer>
    </div>
  </section>

  <noscript>这款游戏需要启用 JavaScript。</noscript>
</body>
</html>
