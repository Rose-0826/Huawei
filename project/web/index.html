<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雾镇旅馆 · 审讯桌</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="scene">
    <div class="wall" aria-hidden="true">
      <div class="wall-glow"></div>
      <div class="window">
        <div class="window-pane"></div>
        <div class="snow"></div>
        <div class="window-cross"></div>
      </div>
      <div class="lamp">
        <div class="lamp-cord"></div>
        <div class="lamp-shade"></div>
        <div class="lamp-bulb"></div>
      </div>
    </div>

    <header class="scene-header">
      <div class="case-heading">
        <p class="case-kicker">CASE FILE · MISTVALE INN</p>
        <h1 id="game-title">雾镇旅馆</h1>
        <p id="era" class="case-era">1937 年冬 · 暴雪封山</p>
      </div>
      <div class="header-actions">
        <button id="restart-button" class="ghost-button" type="button">重开</button>
        <button id="accuse-button" class="accuse-button" type="button" disabled>指认</button>
      </div>
    </header>

    <nav id="side-rail" class="side-rail" aria-label="换人"></nav>

    <div id="speech" class="speech narration" aria-live="polite">
      <span id="speech-text"></span>
    </div>

    <div id="confront-log" class="confront-log hidden" aria-live="polite">
      <div class="confront-head">
        <p class="confront-question-line">
          <span class="confront-label">本次问题</span>
          <span id="confront-question-echo" class="confront-question"></span>
        </p>
        <span class="confront-count">对质 · 两人</span>
      </div>
      <div class="confront-line">
        <span id="confront-who-a" class="confront-who"></span>
        <span id="confront-say-a" class="confront-say"></span>
      </div>
      <div class="confront-line">
        <span id="confront-who-b" class="confront-who"></span>
        <span id="confront-say-b" class="confront-say"></span>
      </div>
      <div class="confront-history" aria-label="先前对质">
        <p class="confront-history-title">对质记录</p>
        <ol class="confront-history-list"></ol>
      </div>
      <p id="confront-verdict" class="confront-verdict"></p>
    </div>

    <div class="chair" aria-hidden="true"></div>

    <div id="actor" class="actor hidden mood-guarded" aria-hidden="true">
      <div class="actor-glow"></div>
      <div class="actor-pose">
        <div class="actor-hat"></div>
        <div class="actor-braid actor-braid-l"></div>
        <div class="actor-braid actor-braid-r"></div>
        <div class="actor-head">
          <div class="actor-hair"></div>
          <div class="actor-glasses"></div>
        </div>
        <div class="actor-body">
          <div class="actor-collar"></div>
        </div>
      </div>
    </div>

    <div id="actor-id" class="actor-id hidden mood-guarded">
      <p id="actor-name" class="actor-name"></p>
      <p id="actor-public" class="actor-public"></p>
      <p id="actor-mood" class="actor-mood mood-guarded">戒备</p>
    </div>

    <div id="table-focus" class="table-focus">
      <div id="table-evidence" class="table-evidence hidden"></div>
      <div id="combine-card" class="combine-card hidden" role="status" aria-live="polite">
        <span class="combine-stamp">对撞</span>
        <p id="combine-title" class="combine-title"></p>
        <p id="combine-text" class="combine-text"></p>
        <p id="combine-pressure" class="combine-pressure"></p>
        <p id="combine-reaction" class="combine-reaction hidden"></p>
        <div class="combine-actions">
          <button id="combine-followup" class="combine-followup hidden" type="button">拿这条去问他</button>
        </div>
      </div>
    </div>

    <section class="table" aria-label="审讯桌">
      <div class="table-surface" aria-hidden="true"></div>
      <div class="table-lip" aria-hidden="true"></div>

      <div class="desk">
        <section class="hand" aria-label="手边物证">
          <div class="hand-title">手边 · 物证<span id="hand-hint" class="hand-hint">点纸片查看详情</span></div>
          <div id="clue-hand" class="clue-hand"></div>
          <div id="hand-actions" class="hand-actions">
            <p id="combine-rule" class="combine-rule">两张有共同人物/时间的物证可以拼</p>
            <p id="present-target" class="present-target"></p>
            <div class="hand-buttons">
              <button id="present-button" class="present-button hidden" type="button">出示</button>
              <button id="combine-button" class="combine-button" type="button"
                      aria-pressed="false">对撞</button>
              <span id="combine-count" class="combine-count" aria-live="polite">对撞 3/3</span>
              <button id="combine-exit" class="combine-exit hidden" type="button">退出</button>
            </div>
          </div>
        </section>

        <section class="ask-desk" aria-label="问话">
          <div class="ask-row">
            <p id="last-question" class="last-question"></p>
            <button id="confront-toggle" class="confront-toggle" type="button"
                    aria-pressed="false">对质</button>
          </div>
          <form id="ask-form" class="ask-form" autocomplete="off">
            <input id="question-input" type="text" maxlength="200"
                   placeholder="先点左边一个人，再问" aria-label="向嫌疑人提问">
            <button id="send-button" class="send-button" type="submit" disabled>问</button>
          </form>
        </section>
      </div>
    </section>
  </div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

  <section id="verdict" class="verdict hidden" aria-hidden="true" role="dialog"
           aria-modal="true" aria-labelledby="verdict-title">
    <div class="verdict-frame">
      <header class="verdict-header">
        <p class="case-kicker">CASE CLOSED?</p>
        <h2 id="verdict-title" class="verdict-result">真相</h2>
        <p id="verdict-subtitle" class="verdict-subtitle"></p>
      </header>
      <div class="verdict-grid">
        <section class="truth-panel">
          <h3>真相时间线</h3>
          <ol id="truth-timeline" class="truth-list"></ol>
        </section>
        <section class="missed-panel">
          <h3>你漏掉的破案链</h3>
          <p id="missed-summary" class="missed-summary"></p>
          <div id="missed-ids" class="missed-ids"></div>
          <p class="missed-note">只给编号，内容留给你自己回去想。</p>
        </section>
      </div>
      <footer class="verdict-actions">
        <button id="restart-verdict" class="ghost-button" type="button">重新开局</button>
      </footer>
    </div>
  </section>

  <noscript>这款游戏需要启用 JavaScript。</noscript>
</body>
</html>
